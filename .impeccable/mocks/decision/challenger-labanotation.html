<!doctype html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--paper:#fbfaf7;--ink:#111;--ink2:#5c5a55;--rule:#d9d6cf;--theme:#f07c23}
body{width:390px;height:844px;overflow:hidden;background:var(--paper);color:var(--ink);font-family:'Public Sans',sans-serif;display:grid;grid-template-columns:1fr 96px;grid-template-rows:56px 1fr 150px}
header{grid-column:1/3;display:flex;align-items:center;padding:0 16px;font-weight:800;font-size:18px;border-bottom:1px solid var(--rule)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px;align-content:start}
.item{border:1px solid var(--rule);border-radius:12px;overflow:hidden;background:#fff}
.img{height:84px;background:#e7e4dd}
.meta{padding:6px 8px 8px}.name{font-size:13px;font-weight:500;line-height:1.2}
.price{font-weight:700;font-size:16px;margin-top:4px;font-variant-numeric:tabular-nums}
.sold{opacity:.4}
.staff{border-left:1px solid var(--rule);position:relative;padding:12px 0;display:flex;flex-direction:column-reverse;align-items:center;gap:6px}
.staff:before{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;background:var(--ink)}
.blk{position:relative;width:34px;background:var(--ink);border-radius:2px}
.blk.h{background:repeating-linear-gradient(45deg,var(--ink) 0 3px,var(--paper) 3px 6px);border:2px solid var(--ink)}
.blk.t{background:var(--theme)}
.foot{grid-column:1/3;border-top:1px solid var(--rule);padding:12px 16px 20px;display:flex;flex-direction:column;gap:10px}
.tot{display:flex;justify-content:space-between;align-items:baseline}.tot b{font-size:50px;font-weight:800;font-variant-numeric:tabular-nums}
.pay{height:60px;border-radius:12px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-weight:800;font-size:20px}
</style></head><body>
<header>Huldance Merch</header>
<div class="grid">
 <div class="item"><div class="img"></div><div class="meta"><div class="name">Huldance-caps</div><div class="price">369 kr</div></div></div>
 <div class="item"><div class="img"></div><div class="meta"><div class="name">Notatbok</div><div class="price">99 kr</div></div></div>
 <div class="item"><div class="img"></div><div class="meta"><div class="name">Nøkkelring</div><div class="price">79 kr</div></div></div>
 <div class="item"><div class="img"></div><div class="meta"><div class="name">Ryggsekk</div><div class="price">649 kr</div></div></div>
 <div class="item sold"><div class="img"></div><div class="meta"><div class="name">T-skjorte (Barn)</div><div class="price">349 kr</div></div></div>
 <div class="item"><div class="img"></div><div class="meta"><div class="name">Hettegenser (Barn)</div><div class="price">249 kr</div></div></div>
 <div class="item"><div class="img"></div><div class="meta"><div class="name">Popsocket</div><div class="price">79 kr</div></div></div>
 <div class="item"><div class="img"></div><div class="meta"><div class="name">Vifte</div><div class="price">79 kr</div></div></div>
</div>
<div class="staff"><div class="blk t" style="height:80px"></div><div class="blk" style="height:40px"></div><div class="blk h" style="height:40px"></div></div>
<div class="foot"><div class="tot"><span>3 varer</span><b>817 kr</b></div><div class="pay">Fullfør salg</div></div>
</body></html>
