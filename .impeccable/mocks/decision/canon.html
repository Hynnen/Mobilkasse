<!doctype html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f4f4f5;--card:#fff;--ink:#18181b;--ink2:#71717a;--theme:#f07c23}
body{width:390px;height:844px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,sans-serif;position:relative}
header{height:56px;background:#fff;display:flex;align-items:center;padding:0 16px;font-weight:700;font-size:17px;border-bottom:1px solid #e4e4e7}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.item{position:relative;background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.img{height:108px;background:#e4e4e7}
.meta{padding:8px 10px 10px}.name{font-weight:500;font-size:14px}
.row{display:flex;justify-content:space-between;margin-top:6px}.price{font-weight:700}.stock{font-size:12px;color:var(--ink2)}
.badge{position:absolute;top:8px;right:8px;background:var(--theme);color:#fff;font-weight:700;font-size:14px;width:28px;height:28px;border-radius:14px;display:grid;place-items:center}
.sold{opacity:.45}
.tray{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e4e4e7;padding:14px 16px 22px;box-shadow:0 -6px 20px rgba(0,0,0,.06)}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}.tot b{font-size:40px;font-weight:700}
.pay{height:56px;border-radius:12px;background:var(--theme);color:#fff;display:grid;place-items:center;font-weight:600;font-size:18px}
</style></head><body>
<header>Huldance Merch</header>
<div class="grid">
 <div class="item"><div class="img"></div><div class="badge">2</div><div class="meta"><div class="name">Huldance-caps</div><div class="row"><span class="price">369 kr</span><span class="stock">3 igjen</span></div></div></div>
 <div class="item"><div class="img"></div><div class="meta"><div class="name">Huldance notatbok</div><div class="row"><span class="price">99 kr</span><span class="stock">75 igjen</span></div></div></div>
 <div class="item"><div class="img"></div><div class="badge">1</div><div class="meta"><div class="name">Nøkkelring</div><div class="row"><span class="price">79 kr</span><span class="stock">98 igjen</span></div></div></div>
 <div class="item"><div class="img"></div><div class="meta"><div class="name">Ryggsekk</div><div class="row"><span class="price">649 kr</span><span class="stock">Restordre</span></div></div></div>
 <div class="item sold"><div class="img"></div><div class="meta"><div class="name">T-skjorte (Barn)</div><div class="row"><span class="price">349 kr</span><span class="stock">Utsolgt</span></div></div></div>
 <div class="item"><div class="img"></div><div class="meta"><div class="name">Hettegenser (Barn)</div><div class="row"><span class="price">249 kr</span><span class="stock">18 igjen</span></div></div></div>
</div>
<div class="tray"><div class="tot"><span>3 varer</span><b>817 kr</b></div><div class="pay">Fullfør salg</div></div>
</body></html>
