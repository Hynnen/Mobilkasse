<!doctype html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,500;6..12,700;6..12,800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ground:#f6f1ea;--card:#fff;--ink:#2a2420;--ink2:#7a6f66;--act:#f07c23}
body{width:390px;height:844px;overflow:hidden;background:var(--ground);color:var(--ink);font-family:'Nunito Sans',sans-serif;position:relative}
header{height:56px;display:flex;align-items:center;padding:0 18px;font-weight:800;font-size:19px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:4px 14px}
.item{position:relative;background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 2px 10px rgba(80,50,20,.06)}
.img{height:110px;background:#efe6da;margin:6px;border-radius:15px}
.meta{padding:4px 12px 12px}.name{font-weight:700;font-size:15px}
.row{display:flex;justify-content:space-between;margin-top:4px}.price{font-weight:800}.stock{font-size:13px;color:var(--ink2)}
.n{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:16px;background:var(--act);color:#fff;font-weight:800;display:grid;place-items:center}
.sold{opacity:.45}
.tray{position:absolute;left:10px;right:10px;bottom:12px;background:#fff;border-radius:26px;padding:14px 16px 16px;box-shadow:0 -4px 24px rgba(80,50,20,.10)}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}.tot b{font-size:44px;font-weight:800}
.pay{height:60px;border-radius:30px;background:var(--act);color:#fff;display:grid;place-items:center;font-weight:800;font-size:19px}
</style></head><body>
<header>Huldance Merch</header>
<div class="grid">
 <div class="item"><div class="img"></div><div class="n">2</div><div class="meta"><div class="name">Huldance-caps</div><div class="row"><span class="price">369 kr</span><span class="stock">3 igjen</span></div></div></div>
 <div class="item"><div class="img"></div><div class="meta"><div class="name">Notatbok</div><div class="row"><span class="price">99 kr</span><span class="stock">75 igjen</span></div></div></div>
 <div class="item"><div class="img"></div><div class="n">1</div><div class="meta"><div class="name">Nøkkelring</div><div class="row"><span class="price">79 kr</span><span class="stock">98 igjen</span></div></div></div>
 <div class="item"><div class="img"></div><div class="meta"><div class="name">Ryggsekk</div><div class="row"><span class="price">649 kr</span><span class="stock">Restordre</span></div></div></div>
 <div class="item sold"><div class="img"></div><div class="meta"><div class="name">T-skjorte (Barn)</div><div class="row"><span class="price">349 kr</span><span class="stock">Utsolgt</span></div></div></div>
 <div class="item"><div class="img"></div><div class="meta"><div class="name">Hettegenser</div><div class="row"><span class="price">249 kr</span><span class="stock">18 igjen</span></div></div></div>
</div>
<div class="tray"><div class="tot"><span>3 varer</span><b>817 kr</b></div><div class="pay">Fullfør salg</div></div>
</body></html>
