<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ingen nett</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
    background: #fdf6ee; color: #2a211b; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
  main { max-width: 22rem; padding: 24px; }
  h1 { font-size: 24px; font-weight: 800; margin: 0 0 8px; }
  p { font-size: 17px; line-height: 1.4; color: #6f6259; margin: 0 0 28px; }
  button { width: 100%; height: 64px; border: 0; border-radius: 999px; background: #2a211b; color: #fff;
    font: 800 19px system-ui, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>Ingen nettforbindelse</h1>
  <p>Kassen trenger nett for å hente varer og registrere salg. Ingen salg er registrert mens du er uten nett.</p>
  <button onclick="location.reload()">Prøv igjen</button>
</main>
</body>
</html>
